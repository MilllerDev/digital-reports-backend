spring:
  application:
    name: digital-reports
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
